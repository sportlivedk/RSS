<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPORT LIVE RSS</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1a1d21;
      --muted: #5f6672;
      --border: #d8dde6;
      --green: #1e8e3e;
      --green-hover: #187332;
      --blue: #0b57d0;
      --danger: #c5221f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 64px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    /* Login-vindue (vises før selve websiden) */
    .login-wrapper {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      text-align: center;
    }

    .login-card img {
      max-height: 84px;
      max-width: min(280px, 100%);
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto 14px;
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 1.3rem;
    }

    .login-card p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .login-card .form-group {
      text-align: left;
    }

    .login-error {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 5px;
      background: #fce8e6;
      color: #a50e0e;
      border: 1px solid #f5c2c0;
      font-size: 0.88rem;
      text-align: left;
    }

    /* Selve applikationen (skjult indtil login er godkendt) */
    #appContent {
      display: none;
    }

    /* Header & Logo */
    header {
      text-align: center;
      margin-bottom: 26px;
    }

    header img {
      max-height: 136px;
      max-width: min(520px, 100%);
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto 8px;
    }

    header h1 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .feed-actions {
      margin-top: 28px; /* Dobbelt linjeskift-luft under overskriften */
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 1.15rem;
    }

    /* Formularfelter */
    .form-group {
      margin-bottom: 14px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="url"],
    input[type="password"],
    input[type="datetime-local"] {
      width: 100%;
      padding: 9px 11px;
      font-size: 0.95rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
      color: var(--text);
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(11, 87, 208, 0.15);
    }

    /* Knapper & Ikoner */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover { background: #f1f3f5; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-icon {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .btn-block { width: 100%; }

    .btn-green {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .btn-green:hover {
      background: var(--green-hover);
      border-color: var(--green-hover);
    }

    .btn-danger {
      color: var(--danger);
      border-color: #f1c1c0;
    }

    .btn-danger:hover { background: #fce8e6; }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.84rem;
    }

    /* Statusbeskeder */
    #statusBanner {
      display: none;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 0.92rem;
      font-weight: 500;
    }

    #statusBanner.info { display: block; background: #e8f0fe; color: #174ea6; border: 1px solid #c2d7fa; }
    #statusBanner.success { display: block; background: #e6f4ea; color: #137333; border: 1px solid #b7dfbf; }
    #statusBanner.error { display: block; background: #fce8e6; color: #a50e0e; border: 1px solid #f5c2c0; }

    /* Indholds-oversigt */
    .list-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .list-header h2 { margin: 0; }

    .search-box {
      width: 280px;
      max-width: 100%;
    }

    .clip-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px 18px;
      margin-bottom: 12px;
      background: #fafbfc;
    }

    .clip-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .clip-title {
      font-weight: 700;
      font-size: 1.02rem;
      margin: 0;
      word-break: break-word;
    }

    .clip-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .clip-meta {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 4px 10px;
      font-size: 0.87rem;
    }

    .clip-meta dt {
      color: var(--muted);
      font-weight: 600;
    }

    .clip-meta dd {
      margin: 0;
      word-break: break-all;
    }

    .clip-meta a {
      color: var(--blue);
      text-decoration: none;
    }

    .clip-meta a:hover { text-decoration: underline; }

    .clip-edit-panel {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .clip-edit-panel.open { display: block; }

    .edit-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .show-more-wrap {
      text-align: center;
      margin-top: 16px;
    }

    /* Popup Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 8px;
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 { margin: 0; font-size: 1.05rem; }

    .modal-body {
      padding: 16px 20px;
      overflow: auto;
      background: #1e1e1e;
      color: #e8eaed;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.83rem;
      white-space: pre;
      flex: 1;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LOGIN-VINDUE -->
  <div class="login-wrapper" id="loginScreen">
    <div class="login-card">
      <img src="logo.png" alt="SPORT LIVE" onerror="this.style.display='none'">
      <h1>Højdepunkter til Ekstra Bladet</h1>
      <p id="loginSubtitle">Indtast jeres GitHub-nøgle for at åbne administrationen. Browseren husker nøglen fremover.</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginTokenInput">GitHub-adgangsnøgle</label>
          <input type="password" id="loginTokenInput" required placeholder="github_pat_..." autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-green btn-block" id="btnLoginSubmit">Log ind</button>
      </form>
    </div>
  </div>

  <!-- SELVE WEBSIDEN -->
  <div id="appContent">
    <header>
      <img src="logo.png" alt="SPORT LIVE" onerror="this.style.display='none'">
      <h1>Højdepunkter til Ekstra Bladet</h1>

      <div class="feed-actions">
        <button type="button" class="btn" id="btnShowPopup">
          <svg class="btn-icon" style="color: #0b57d0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Vis RSS-feed</span>
        </button>

        <a href="rss.xml" target="_blank" rel="noopener" class="btn" id="linkOpenFeed">
          <svg class="btn-icon" style="color: #e37400;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span>Åbn RSS i ny fane</span>
        </a>

        <button type="button" class="btn" id="btnCopyUrl">
          <svg class="btn-icon" style="color: #7c3aed;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copyUrlText">Kopiér URL til RSS-feed</span>
        </button>
      </div>
    </header>

    <div id="statusBanner"></div>

    <!-- Tilføj ny video -->
    <div class="card">
      <h2>Tilføj ny video</h2>
      <form id="addClipForm">
        <div class="form-group">
          <label for="newTitle">Titel</label>
          <input type="text" id="newTitle" required placeholder="F.eks. Basketball: Bakken Bears - Svendborg Rabbits">
        </div>

        <div class="form-group">
          <label for="newVideoUrl">URL til video</label>
          <input type="url" id="newVideoUrl" required placeholder="F.eks. http://89.188.72.190/sportlive/Highlights_F3DKC917246001.mp4">
        </div>

        <div class="form-group">
          <label for="newPubDate">Udgivelsesdato</label>
          <input type="datetime-local" id="newPubDate" required>
        </div>

        <div class="form-group">
          <label for="newThumbUrl">URL til billede</label>
          <input type="url" id="newThumbUrl" required placeholder="F.eks. http://89.188.72.190/sportlive/Thumb_F3DKC917246001.png">
        </div>

        <div class="form-group">
          <label for="newTags">Tags (adskilles med komma)</label>
          <input type="text" id="newTags" placeholder="F.eks. basketball, basketligaen, sport">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-green" id="btnSubmitNew">Gem</button>
        </div>
      </form>
    </div>

    <!-- Oversigt over indhold i RSS-filen -->
    <div class="card">
      <div class="list-header">
        <h2 id="listHeading">Indhold i RSS-filen (0)</h2>
        <input type="text" id="searchInput" class="search-box" placeholder="Søg i titel, link eller tags...">
      </div>

      <div id="clipsContainer">Indlæser indhold...</div>

      <div class="show-more-wrap" id="showMoreWrap" style="display:none;">
        <button type="button" class="btn" id="btnShowAll">Vis alle</button>
      </div>
    </div>
  </div>

</div>

<!-- Popup-vindue til visning af rå RSS-kode -->
<div class="modal-backdrop" id="xmlModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Indhold af RSS-feed (<span id="modalFileLabel">rss.xml</span>)</h3>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-sm" id="btnCopyXml">Kopiér XML</button>
        <button type="button" class="btn btn-sm" id="btnCloseModal">Luk ✕</button>
      </div>
    </div>
    <div class="modal-body" id="xmlModalContent"></div>
  </div>
</div>

<script>
  const GITHUB_CONFIG = {
    owner: 'sportlivedk',
    repo: 'RSS',
    branch: 'main',
    path: 'rss.xml'
  };

  const TOKEN_STORAGE_KEY = 'sl_rss_token';
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DEFAULT_LIMIT = 25;

  let activeToken = '';
  let items = [];
  let currentSha = null;
  let showAllItems = false;

  function getPublicFeedUrl() {
    return `https://${GITHUB_CONFIG.owner}.github.io/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.path}`;
  }

  function showStatus(msg, type = 'info') {
    const el = document.getElementById('statusBanner');
    el.textContent = msg;
    el.className = type;
    el.style.display = 'block';
    if (type === 'success') {
      setTimeout(() => {
        if (el.textContent === msg) el.style.display = 'none';
      }, 5000);
    }
  }

  function showLoginError(msg) {
    const errEl = document.getElementById('loginError');
    if (!msg) {
      errEl.style.display = 'none';
      errEl.textContent = '';
    } else {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }
  }

  // --- Validering af GitHub-nøgle ved login ---
  async function verifyGitHubToken(token) {
    const clean = (token || '').trim();
    if (!clean) return { ok: false, reason: 'Indtast venligst en nøgle.' };

    const headers = {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${clean}`
    };

    try {
      const userRes = await fetch(`https://api.github.com/user?t=${Date.now()}`, {
        cache: 'no-store',
        headers
      });

      if (userRes.status === 401) {
        return { ok: false, reason: 'Nøglen er ugyldig eller udløbet. Opret eller indsæt en gyldig nøgle.' };
      }
      if (!userRes.ok) {
        return { ok: false, reason: `GitHub afviste forbindelsen (HTTP ${userRes.status}).` };
      }

      const repoRes = await fetch(
        `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}?t=${Date.now()}`,
        { cache: 'no-store', headers }
      );

      if (repoRes.status === 404) {
        return {
          ok: false,
          reason: `Repositoriet ${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo} blev ikke fundet (tjek at det er oprettet på GitHub).`
        };
      }
      if (!repoRes.ok) {
        return { ok: false, reason: `Kunne ikke tilgå repositoriet (HTTP ${repoRes.status}).` };
      }

      const repoData = await repoRes.json();
      if (repoData.permissions && repoData.permissions.push === false) {
        return { ok: false, reason: 'Kontoen bag nøglen har ikke skriveadgang til repositoriet.' };
      }

      return { ok: true };
    } catch (err) {
      return { ok: false, reason: 'Netværksfejl ved kontakt til GitHub. Tjek internetforbindelsen.' };
    }
  }

  async function unlockAppWithToken(token, isAutoLogin = false) {
    const btn = document.getElementById('btnLoginSubmit');
    const form = document.getElementById('loginForm');
    const subtitle = document.getElementById('loginSubtitle');

    showLoginError('');
    btn.disabled = true;
    btn.textContent = 'Kontrollerer nøgle...';
    if (isAutoLogin) {
      form.style.display = 'none';
      subtitle.textContent = 'Logger automatisk ind...';
    }

    const check = await verifyGitHubToken(token);

    btn.disabled = false;
    btn.textContent = 'Log ind';
    form.style.display = 'block';
    subtitle.textContent = 'Indtast jeres GitHub-nøgle for at åbne administrationen. Browseren husker nøglen fremover.';

    if (!check.ok) {
      localStorage.removeItem(TOKEN_STORAGE_KEY);
      activeToken = '';
      document.getElementById('appContent').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      showLoginError(check.reason);
      return;
    }

    activeToken = token.trim();
    localStorage.setItem(TOKEN_STORAGE_KEY, activeToken);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    document.getElementById('newPubDate').value = getNowLocalInput();
    await loadFeedFromGitHub();
  }

  function lockApp(reasonMsg = '') {
    localStorage.removeItem(TOKEN_STORAGE_KEY);
    activeToken = '';
    document.getElementById('loginTokenInput').value = '';
    document.getElementById('appContent').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    showLoginError(reasonMsg);
  }

  // --- Dato- og tidsformatering ---
  function getNowLocalInput() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${d}T${hh}:${mm}`;
  }

  function localInputToPubDate(dtLocal) {
    const [datePart, timePart] = dtLocal.split('T');
    const [y, m, d] = datePart.split('-').map(Number);
    const [hh, mm] = (timePart || '00:00').split(':').map(Number);
    const utcObj = new Date(Date.UTC(y, m - 1, d, hh, mm, 0));
    const dayName = DAYS[utcObj.getUTCDay()];
    const dd = String(d).padStart(2, '0');
    const monName = MONTHS[m - 1];
    const HH = String(hh).padStart(2, '0');
    const MM = String(mm).padStart(2, '0');
    return `${dayName}, ${dd} ${monName} ${y} ${HH}:${MM}:00 +0000`;
  }

  function parsePubDate(pubDateStr) {
    const d = new Date((pubDateStr || '').trim());
    if (isNaN(d.getTime())) {
      const fallback = getNowLocalInput();
      return { timestamp: 0, dtLocal: fallback, display: pubDateStr || 'Ukendt dato' };
    }
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
    const day = String(d.getUTCDate()).padStart(2, '0');
    const hh = String(d.getUTCHours()).padStart(2, '0');
    const mm = String(d.getUTCMinutes()).padStart(2, '0');
    return {
      timestamp: d.getTime(),
      dtLocal: `${y}-${m}-${day}T${hh}:${mm}`,
      display: `${day}-${m}-${y} ${hh}:${mm}`
    };
  }

  // --- UTF-8 Base64 & XML-hjælpere ---
  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function base64ToUtf8(b64) {
    const binary = atob(b64.replace(/\s/g, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function escapeXml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function sortItemsDesc() {
    items.sort((a, b) => parsePubDate(b.pubDate).timestamp - parsePubDate(a.pubDate).timestamp);
  }

  function buildXmlString() {
    const feedUrl = getPublicFeedUrl();
    const lastBuild = localInputToPubDate(getNowLocalInput());
    const itemBlocks = items.map(it => [
      '    <item>',
      `      <title>${escapeXml(it.title)}</title>`,
      `      <link>${escapeXml(it.link)}</link>`,
      `      <pubDate>${escapeXml(it.pubDate)}</pubDate>`,
      `      <enclosure url="${escapeXml(it.thumb)}" type="image/jpeg" length="0" />`,
      `      <guid>${escapeXml(it.link)}</guid>`,
      `      <category>${escapeXml(it.tags)}</category>`,
      '    </item>'
    ].join('\n')).join('\n');

    return [
      '<?xml version="1.0" encoding="UTF-8"?>',
      '<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">',
      '  <channel>',
      '    <title>SportLive RSS Feed</title>',
      '    <link>https://www.sport-live.dk/</link>',
      `    <atom:link href="${escapeXml(feedUrl)}" rel="self" type="application/rss+xml" xmlns:atom="http://www.w3.org/2005/Atom"/>`,
      '    <description>Latest submissions from SportLive</description>',
      `    <lastBuildDate>${escapeXml(lastBuild)}</lastBuildDate>`,
      itemBlocks,
      '  </channel>',
      '</rss>',
      ''
    ].join('\n');
  }

  function parseXmlToItems(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    if (doc.querySelector('parsererror')) {
      throw new Error('RSS-filen indeholder ugyldig XML.');
    }
    const nodes = Array.from(doc.querySelectorAll('channel > item'));
    return nodes.map((node, idx) => {
      const getTxt = tag => node.querySelector(tag)?.textContent ?? '';
      const enc = node.querySelector('enclosure');
      return {
        id: 'item_' + Date.now() + '_' + idx,
        title: getTxt('title').trim(),
        link: getTxt('link').trim(),
        pubDate: getTxt('pubDate').trim(),
        thumb: (enc?.getAttribute('url') || '').trim(),
        tags: getTxt('category').trim()
      };
    });
  }

  // --- URL-tjek mod tastefejl ---
  function validateUrlsBeforeSave(videoUrl, thumbUrl) {
    const warnings = [];
    if (/\s/.test(videoUrl)) warnings.push('Video-URL indeholder mellemrum.');
    if (!/\.(mp4|mov)$/i.test(videoUrl)) warnings.push('Video-URL slutter ikke på .mp4 eller .mov.');
    if (/\s/.test(thumbUrl)) warnings.push('Billede-URL indeholder mellemrum.');
    if (!/\.(png|jpg|jpeg)$/i.test(thumbUrl)) warnings.push('Billede-URL slutter ikke på .png eller .jpg.');

    if (warnings.length > 0) {
      return confirm('Bemærk:\n- ' + warnings.join('\n- ') + '\n\nVil du gemme videoen alligevel?');
    }
    return true;
  }

  // --- GitHub API ---
  async function loadFeedFromGitHub() {
    const { owner, repo, branch, path } = GITHUB_CONFIG;
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}&t=${Date.now()}`;
    const headers = {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${activeToken}`
    };

    try {
      const res = await fetch(apiUrl, { cache: 'no-store', headers });
      if (res.status === 401) {
        lockApp('Din GitHub-nøgle er udløbet eller ugyldig. Indtast en ny nøgle.');
        return;
      }
      if (res.status === 404) {
        items = [];
        currentSha = null;
        renderList();
        showStatus(`Ingen ${path} fundet endnu. Filen oprettes automatisk, når du gemmer din første video.`, 'info');
        return;
      }
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      currentSha = data.sha;
      const xmlText = base64ToUtf8(data.content);
      items = parseXmlToItems(xmlText);
      sortItemsDesc();
      renderList();
    } catch (err) {
      document.getElementById('clipsContainer').textContent = 'Kunne ikke hente RSS-filen.';
      showStatus(`Kunne ikke hente RSS-filen fra GitHub (${err.message}).`, 'error');
    }
  }

  async function saveFeedToGitHub(commitMessage) {
    const { owner, repo, branch, path } = GITHUB_CONFIG;
    sortItemsDesc();
    const xmlString = buildXmlString();
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const headers = {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${activeToken}`,
      'Content-Type': 'application/json'
    };

    try {
      showStatus('Gemmer i GitHub...', 'info');

      const checkRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}&t=${Date.now()}`, { cache: 'no-store', headers });
      if (checkRes.status === 401) {
        lockApp('Din GitHub-nøgle er udløbet. Log ind med en ny nøgle for at gemme.');
        return false;
      }
      if (checkRes.ok) {
        const checkData = await checkRes.json();
        currentSha = checkData.sha;
      } else if (checkRes.status === 404) {
        currentSha = null;
      }

      const body = {
        message: commitMessage,
        content: utf8ToBase64(xmlString),
        branch
      };
      if (currentSha) body.sha = currentSha;

      const putRes = await fetch(apiUrl, {
        method: 'PUT',
        headers,
        body: JSON.stringify(body)
      });

      if (putRes.status === 401) {
        lockApp('Din GitHub-nøgle er udløbet. Log ind med en ny nøgle.');
        return false;
      }
      if (putRes.status === 403) {
        lockApp('Den indtastede nøgle mangler skriverettighed ("Contents: Read and write") til RSS-repositoriet. Indtast en nøgle med skriveadgang.');
        return false;
      }
      if (!putRes.ok) {
        const errData = await putRes.json().catch(() => ({}));
        throw new Error(errData.message || `HTTP ${putRes.status}`);
      }

      const result = await putRes.json();
      currentSha = result.content.sha;
      renderList();
      showStatus('RSS-filen er opdateret på GitHub.', 'success');
      return true;
    } catch (err) {
      showStatus(`Fejl under gemning: ${err.message}`, 'error');
      return false;
    }
  }

  // --- Visning af oversigt ---
  function renderList() {
    const container = document.getElementById('clipsContainer');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    document.getElementById('listHeading').textContent = `Indhold i RSS-filen (${items.length})`;

    const filtered = items.filter(it => {
      if (!query) return true;
      return (
        it.title.toLowerCase().includes(query) ||
        it.link.toLowerCase().includes(query) ||
        it.tags.toLowerCase().includes(query) ||
        it.pubDate.toLowerCase().includes(query)
      );
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="color:var(--muted); margin:0;">Intet indhold at vise.</p>';
      document.getElementById('showMoreWrap').style.display = 'none';
      return;
    }

    const visible = (showAllItems || query) ? filtered : filtered.slice(0, DEFAULT_LIMIT);
    const moreWrap = document.getElementById('showMoreWrap');
    if (!showAllItems && !query && filtered.length > DEFAULT_LIMIT) {
      moreWrap.style.display = 'block';
      document.getElementById('btnShowAll').textContent = `Vis alle (${filtered.length})`;
    } else {
      moreWrap.style.display = 'none';
    }

    container.innerHTML = visible.map(it => {
      const parsedDate = parsePubDate(it.pubDate);
      return `
        <div class="clip-item" data-id="${it.id}">
          <div class="clip-top">
            <h3 class="clip-title">${escapeHtml(it.title)}</h3>
            <div class="clip-actions">
              <button type="button" class="btn btn-sm" onclick="toggleEdit('${it.id}')">Rediger</button>
              <button type="button" class="btn btn-sm btn-danger" onclick="deleteClip('${it.id}')">Slet</button>
            </div>
          </div>

          <dl class="clip-meta">
            <dt>Dato:</dt>
            <dd>${escapeHtml(parsedDate.display)}</dd>
            <dt>Link:</dt>
            <dd><a href="${escapeHtml(it.link)}" target="_blank" rel="noopener">${escapeHtml(it.link)}</a></dd>
            <dt>Thumbnail:</dt>
            <dd><a href="${escapeHtml(it.thumb)}" target="_blank" rel="noopener">${escapeHtml(it.thumb)}</a></dd>
            <dt>Tags:</dt>
            <dd>${escapeHtml(it.tags || '—')}</dd>
          </dl>

          <div class="clip-edit-panel" id="edit_${it.id}">
            <div class="form-group">
              <label>Titel</label>
              <input type="text" id="etitle_${it.id}" value="${escapeHtml(it.title)}">
            </div>
            <div class="form-group">
              <label>URL til video</label>
              <input type="url" id="elink_${it.id}" value="${escapeHtml(it.link)}">
            </div>
            <div class="form-group">
              <label>Udgivelsesdato</label>
              <input type="datetime-local" id="edate_${it.id}" value="${escapeHtml(parsedDate.dtLocal)}">
            </div>
            <div class="form-group">
              <label>URL til billede</label>
              <input type="url" id="ethumb_${it.id}" value="${escapeHtml(it.thumb)}">
            </div>
            <div class="form-group">
              <label>Tags (adskilles med komma)</label>
              <input type="text" id="etags_${it.id}" value="${escapeHtml(it.tags)}">
            </div>
            <div class="edit-buttons">
              <button type="button" class="btn btn-sm" onclick="toggleEdit('${it.id}')">Annuller</button>
              <button type="button" class="btn btn-green btn-sm" onclick="saveEditedClip('${it.id}')">Gem</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // --- Handlinger på eksisterende indhold ---
  window.toggleEdit = function(id) {
    const panel = document.getElementById('edit_' + id);
    if (panel) panel.classList.toggle('open');
  };

  window.saveEditedClip = async function(id) {
    const idx = items.findIndex(x => x.id === id);
    if (idx === -1) return;

    const title = document.getElementById('etitle_' + id).value.trim();
    const link = document.getElementById('elink_' + id).value.trim();
    const dtLocal = document.getElementById('edate_' + id).value;
    const thumb = document.getElementById('ethumb_' + id).value.trim();
    const tags = document.getElementById('etags_' + id).value.trim();

    if (!title || !link || !dtLocal || !thumb) {
      alert('Udfyld venligst både titel, video-URL, dato og billede-URL.');
      return;
    }
    if (!validateUrlsBeforeSave(link, thumb)) return;

    const backup = { ...items[idx] };
    items[idx] = {
      ...items[idx],
      title,
      link,
      pubDate: localInputToPubDate(dtLocal),
      thumb,
      tags
    };

    const ok = await saveFeedToGitHub(`Opdateret: ${title}`);
    if (!ok) items[idx] = backup;
  };

  window.deleteClip = async function(id) {
    const target = items.find(x => x.id === id);
    if (!target) return;
    if (!confirm(`Er du sikker på, at du vil slette:\n"${target.title}"?`)) return;

    const prevItems = [...items];
    items = items.filter(x => x.id !== id);
    const ok = await saveFeedToGitHub(`Slettet: ${target.title}`);
    if (!ok) items = prevItems;
  };

  // --- Opstart og Event Listeners ---
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('linkOpenFeed').href = getPublicFeedUrl();
    document.getElementById('modalFileLabel').textContent = GITHUB_CONFIG.path;

    const savedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
    if (savedToken) {
      unlockAppWithToken(savedToken, true);
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const inputToken = document.getElementById('loginTokenInput').value;
      unlockAppWithToken(inputToken, false);
    });

    document.getElementById('addClipForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('newTitle').value.trim();
      const link = document.getElementById('newVideoUrl').value.trim();
      const dtLocal = document.getElementById('newPubDate').value;
      const thumb = document.getElementById('newThumbUrl').value.trim();
      const tags = document.getElementById('newTags').value.trim();

      if (!validateUrlsBeforeSave(link, thumb)) return;

      const btn = document.getElementById('btnSubmitNew');
      btn.disabled = true;

      const newItem = {
        id: 'item_' + Date.now(),
        title,
        link,
        pubDate: localInputToPubDate(dtLocal),
        thumb,
        tags
      };

      items.unshift(newItem);
      const ok = await saveFeedToGitHub(`Tilføjet: ${title}`);
      btn.disabled = false;

      if (ok) {
        document.getElementById('addClipForm').reset();
        document.getElementById('newPubDate').value = getNowLocalInput();
      } else {
        items = items.filter(x => x.id !== newItem.id);
      }
    });

    document.getElementById('searchInput').addEventListener('input', renderList);

    document.getElementById('btnShowAll').addEventListener('click', () => {
      showAllItems = true;
      renderList();
    });

    document.getElementById('btnShowPopup').addEventListener('click', () => {
      document.getElementById('xmlModalContent').textContent = buildXmlString();
      document.getElementById('xmlModal').classList.add('open');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => {
      document.getElementById('xmlModal').classList.remove('open');
    });

    document.getElementById('xmlModal').addEventListener('click', (e) => {
      if (e.target.id === 'xmlModal') document.getElementById('xmlModal').classList.remove('open');
    });

    document.getElementById('btnCopyXml').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      await navigator.clipboard.writeText(buildXmlString());
      const orig = btn.textContent;
      btn.textContent = 'Kopieret!';
      setTimeout(() => btn.textContent = orig, 1800);
    });

    document.getElementById('btnCopyUrl').addEventListener('click', async () => {
      const labelEl = document.getElementById('copyUrlText');
      await navigator.clipboard.writeText(getPublicFeedUrl());
      const orig = labelEl.textContent;
      labelEl.textContent = 'URL kopieret!';
      setTimeout(() => labelEl.textContent = orig, 1800);
    });
  });
</script>
