<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPORT LIVE RSS</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1a1d21;
      --muted: #5f6672;
      --border: #d8dde6;
      --green: #2d8653;
      --green-hover: #236b42;
      --blue: #2b6cb0;
      --blue-hover: #215387;
      --danger: #c24542;
      --danger-hover: #a13633;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 64px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    /* Login-vindue (vises før selve websiden) */
    .login-wrapper {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      text-align: center;
    }

    .login-card img {
      max-height: 84px;
      max-width: min(280px, 100%);
      width: auto;
      height: auto;
      display: block;
      margin: 8px auto 5px;
    }

    .login-card h1 {
      margin: 0 0 10px;
      font-size: 1.3rem;
      line-height: 1.25;
    }

    .login-card p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .login-subtitle {
      margin: 0 0 20px;
    }

    .login-subtitle p {
      margin: 0 0 10px;
      line-height: 1.35;
    }

    .login-subtitle p:last-child {
      margin-bottom: 0;
    }

    /* Præcis vertikal centrering under "Logger automatisk ind ..." */
    .login-card.auto-loading {
      padding: 46px 28px 44px;
    }

    .login-card.auto-loading img {
      margin-top: 0;
    }

    .login-card.auto-loading h1 {
      margin-bottom: 8px;
    }

    .login-card.auto-loading p {
      margin-bottom: 0;
    }

    .login-card .form-group {
      text-align: left;
    }

    .login-error {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 5px;
      background: #fce8e6;
      color: #a50e0e;
      border: 1px solid #f5c2c0;
      font-size: 0.88rem;
      text-align: left;
    }

    /* Selve applikationen (skjult indtil login er godkendt) */
    #appContent {
      display: none;
    }

    /* Header & Logo */
    header {
      text-align: center;
      margin-bottom: 26px;
    }

    header img {
      max-height: 126px;
      max-width: min(480px, 100%);
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto 4px;
    }

    header h1 {
      margin: 0;
      font-size: 1.72rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .feed-actions {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 1.15rem;
    }

    /* Formularfelter */
    .form-group {
      margin-bottom: 14px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    /* Diskret grønt flueben ved udfyldte felter */
    .label-with-check {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .field-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      color: var(--green);
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.16s ease, transform 0.16s ease;
      pointer-events: none;
      flex-shrink: 0;
    }

    .field-check.visible {
      opacity: 1;
      transform: scale(1);
    }

    .field-check svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    input[type="text"],
    input[type="url"],
    input[type="password"],
    input[type="datetime-local"],
    select {
      width: 100%;
      padding: 9px 11px;
      font-size: 0.95rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
      color: var(--text);
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(43, 108, 176, 0.18);
    }

    select:disabled {
      background: #f4f5f7;
      color: var(--muted);
      cursor: not-allowed;
    }

    /* Knapper & Ikoner */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover { background: #f1f3f5; }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-icon {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .btn-block { width: 100%; }

    .btn-green {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .btn-green:hover {
      background: var(--green-hover);
      border-color: var(--green-hover);
    }

    .btn-blue {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .btn-blue:hover {
      background: var(--blue-hover);
      border-color: var(--blue-hover);
    }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
      border-color: var(--danger-hover);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.84rem;
    }

    /* Svævende statusbesked øverst i skærmbilledet */
    #statusBanner {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 950;
      min-width: 280px;
      max-width: min(640px, calc(100% - 32px));
      padding: 11px 20px;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      cursor: pointer;
    }

    #statusBanner.info { display: block; background: #e8f0fe; color: #174ea6; border: 1px solid #b5cff8; }
    #statusBanner.success { display: block; background: #e6f4ea; color: #137333; border: 1px solid #a8dab5; }
    #statusBanner.error { display: block; background: #fce8e6; color: #a50e0e; border: 1px solid #f1b6b3; }

    /* Indholds-oversigt */
    .list-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .list-header h2 { margin: 0; }

    .search-box {
      width: 280px;
      max-width: 100%;
    }

    .clip-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 18px;
      background: #fafbfc;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .clip-item:last-child {
      margin-bottom: 0;
    }

    .clip-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .clip-title {
      font-weight: 700;
      font-size: 1.02rem;
      margin: 0;
      word-break: break-word;
    }

    .clip-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .clip-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }

    .clip-meta {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 4px 10px;
      font-size: 0.87rem;
      margin: 0;
    }

    .clip-meta dt {
      color: var(--muted);
      font-weight: 600;
    }

    .clip-meta dd {
      margin: 0;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .clip-meta dd.link-cell {
      color: var(--blue);
    }

    .clip-meta a {
      color: var(--blue);
      text-decoration: none;
    }

    .clip-meta a:hover { text-decoration: underline; }

    /* Lille 16:9 thumbnail rykket ned under Rediger og Slet */
    .clip-thumb-link {
      display: block;
      flex-shrink: 0;
      margin-top: 15px;
      text-decoration: none;
    }

    .clip-body > .clip-thumb-box {
      margin-top: 15px;
    }

    .clip-thumb-box {
      width: 128px;
      height: 72px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #eef1f5;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .clip-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .clip-thumb-fallback {
      display: none;
      color: #9aa2af;
      align-items: center;
      justify-content: center;
    }

    .clip-thumb-box.thumb-unavailable .clip-thumb-fallback {
      display: flex;
    }

    @media (max-width: 580px) {
      .clip-body {
        flex-direction: column;
      }

      .clip-thumb-link,
      .clip-body > .clip-thumb-box {
        margin-top: 4px;
      }
    }

    /* Når der redigeres: Lidt mørkere baggrund samt skjul af faste felter */
    .clip-item.editing {
      background: #eff2f6;
      border-color: #c8d0dc;
    }

    .clip-item.editing .clip-top {
      margin-bottom: 0;
    }

    .clip-item.editing .clip-actions,
    .clip-item.editing .clip-body {
      display: none;
    }

    .clip-edit-panel {
      display: none;
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px solid #cfd6e2;
    }

    .clip-edit-panel.open { display: block; }

    .edit-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .show-more-wrap {
      text-align: center;
      margin-top: 20px;
    }

    /* Popup Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 8px;
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 { margin: 0; font-size: 1.05rem; }

    .modal-body {
      padding: 16px 20px;
      overflow: auto;
      background: #1e1e1e;
      color: #e8eaed;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.83rem;
      white-space: pre;
      flex: 1;
    }
  </style>
</head>
<body>

<div id="statusBanner" title="Klik for at skjule"></div>

<div class="container">

  <!-- LOGIN-VINDUE (ret udløbsdatoen herunder, når GitHub-nøglen fornyes) -->
  <div class="login-wrapper" id="loginScreen">
    <div class="login-card" id="loginCard">
      <img src="logo.png" alt="SPORT LIVE" onerror="this.style.display='none'">
      <h1>Højdepunkter til Ekstra Bladet</h1>
      <div id="loginSubtitle" class="login-subtitle">
        <p>Indtast GitHub-nøgle for at logge ind.</p>
        <p>Nøglen er gyldig indtil 24-11-2027.</p>
      </div>
      <p id="loginLoadingText" style="display:none;">Logger automatisk ind ...</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginTokenInput">Adgangsnøgle</label>
          <input type="password" id="loginTokenInput" required autocomplete="off">
        </div>
        <button type="submit" class="btn btn-green btn-block" id="btnLoginSubmit">Log ind</button>
      </form>
    </div>
  </div>

  <!-- SELVE WEBSIDEN -->
  <div id="appContent">
    <header>
      <img src="logo.png" alt="SPORT LIVE" onerror="this.style.display='none'">
      <h1>Højdepunkter til Ekstra Bladet</h1>

      <div class="feed-actions">
        <button type="button" class="btn" id="btnShowPopup">
          <svg class="btn-icon" style="color: #0b57d0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Vis RSS-feed</span>
        </button>

        <a href="rss.xml" target="_blank" rel="noopener" class="btn" id="linkOpenFeed">
          <svg class="btn-icon" style="color: #e37400;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span>Åbn RSS i ny fane</span>
        </a>

        <button type="button" class="btn" id="btnCopyUrl">
          <svg class="btn-icon" style="color: #7c3aed;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copyUrlText">Kopiér URL til RSS-feed</span>
        </button>
      </div>
    </header>

    <!-- Tilføj ny video -->
    <div class="card">
      <h2>Tilføj ny video</h2>
      <form id="addClipForm">
        <div class="form-group">
          <label for="productionSelect">Hent fra produktionsdatabasen (valgfrit)</label>
          <select id="productionSelect">
            <option value="">Henter seneste produktioner ...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="newTitle" class="label-with-check">
            <span>Titel</span>
            <span class="field-check" id="checkTitle" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.2 8.4 6.6 11.8 12.8 4.6"></polyline></svg>
            </span>
          </label>
          <input type="text" id="newTitle" required placeholder="F.eks. Basketball: Basketligaen: Bakken Bears - Svendborg Rabbits">
        </div>

        <div class="form-group">
          <label for="newVideoUrl" class="label-with-check">
            <span>URL til video</span>
            <span class="field-check" id="checkVideoUrl" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.2 8.4 6.6 11.8 12.8 4.6"></polyline></svg>
            </span>
          </label>
          <input type="url" id="newVideoUrl" required value="http://83.151.146.221/HL_VIDEO_EB/" placeholder="F.eks. http://83.151.146.221/HL_VIDEO_EB/Highlights_F3DKC917246001.mp4">
        </div>

        <div class="form-group">
          <label for="newThumbUrl" class="label-with-check">
            <span>URL til billede</span>
            <span class="field-check" id="checkThumbUrl" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.2 8.4 6.6 11.8 12.8 4.6"></polyline></svg>
            </span>
          </label>
          <input type="url" id="newThumbUrl" required value="http://83.151.146.221/HL_THUMBNAIL_EB/" placeholder="F.eks. http://83.151.146.221/HL_THUMBNAIL_EB/Thumb_F3DKC917246001.png">
        </div>

        <div class="form-group">
          <label for="newPubDate" class="label-with-check">
            <span>Udgivelsestidspunkt</span>
            <span class="field-check" id="checkPubDate" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.2 8.4 6.6 11.8 12.8 4.6"></polyline></svg>
            </span>
          </label>
          <input type="datetime-local" id="newPubDate" required>
        </div>

        <div class="form-group">
          <label for="newTags" class="label-with-check">
            <span>Tags (adskilles med komma)</span>
            <span class="field-check" id="checkTags" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.2 8.4 6.6 11.8 12.8 4.6"></polyline></svg>
            </span>
          </label>
          <input type="text" id="newTags" placeholder="F.eks. basketball, basketligaen, sport">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-green" id="btnSubmitNew">Gem</button>
        </div>
      </form>
    </div>

    <!-- Oversigt over indhold i RSS-filen -->
    <div class="card">
      <div class="list-header">
        <h2 id="listHeading">Indhold i RSS-filen (0)</h2>
        <input type="text" id="searchInput" class="search-box" placeholder="Søg i titel, link eller tags ...">
      </div>

      <div id="clipsContainer">Indlæser indhold ...</div>

      <div class="show-more-wrap" id="showMoreWrap" style="display:none;">
        <button type="button" class="btn" id="btnShowAll">Vis alle</button>
      </div>
    </div>
  </div>

</div>

<!-- Popup-vindue til visning af rå RSS-kode -->
<div class="modal-backdrop" id="xmlModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Indhold af RSS-feed (<span id="modalFileLabel">rss.xml</span>)</h3>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-sm" id="btnCopyXml">Kopiér XML</button>
        <button type="button" class="btn btn-sm" id="btnCloseModal">Luk ✕</button>
      </div>
    </div>
    <div class="modal-body" id="xmlModalContent"></div>
  </div>
</div>

<script>
  const GITHUB_CONFIG = {
    owner: 'sportlivedk',
    repo: 'RSS',
    branch: 'main',
    path: 'rss.xml'
  };

  // Indsæt jeres Google Apps Script Webapp-URL herunder (https://script.google.com/macros/s/.../exec)
  const PRODUCTION_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzbAkvvtjux13RMg6YB2GUN0wZsCVVrnHaBeydCuKU-c-swcWTYIOrrLpAZAo4y2rUR/exec';

  // Antal timer der lægges oven i udsendelsens starttidspunkt fra produktionsdatabasen
  const HOLDBACK_HOURS = 3;

  // Standard-URL'er til nye videoer og billeder (kan frit redigeres i felterne)
  const DEFAULT_VIDEO_PREFIX = 'http://83.151.146.221/HL_VIDEO_EB/';
  const DEFAULT_THUMB_PREFIX = 'http://83.151.146.221/HL_THUMBNAIL_EB/';

  const TOKEN_STORAGE_KEY = 'sl_rss_token';
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DEFAULT_LIMIT = 25;

  // Generiske fyldord, som ikke skal oprettes som selvstændige tags
  const GENERIC_TAG_STOPWORDS = new Set([
    'herrer', 'kvinder', 'mænd', 'damer', 'herre', 'kvinde', 'drenge', 'piger',
    'finale', 'semifinale', 'kvartfinale', 'ottendedelsfinale', 'bronzekamp',
    '1/2-finale', '1/4-finale', '1/8-finale', '1/16-finale',
    'slutspil', 'gruppespil', 'indledende', 'mellemrunde', 'kvalifikation',
    'playoff', 'playoffs', 'final four', 'final 4',
    'kamp', 'runde', 'dag', 'del', 'afsnit', 'episode', 'etape', 'heat', 'løb', 'stævne', 'turnering',
    'live', 'direkte', 'genudsendelse', 'optakt', 'nedtakt', 'studie',
    'højdepunkter', 'highlights', 'sammendrag', 'sport', 'sport live', 'sportlive'
  ]);

  let activeToken = '';
  let items = [];
  let productionItems = [];
  let currentSha = null;
  let showAllItems = false;
  let statusTimer = null;
  let pubDateConfirmed = false;

  function getPublicFeedUrl() {
    return `https://${GITHUB_CONFIG.owner}.github.io/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.path}`;
  }

  function isValidMediaFileUrl(rawVal, defaultPrefix, extPattern) {
    const val = normalizePrefilledUrl(rawVal, defaultPrefix);
    if (!val || val === defaultPrefix || /\/$/.test(val) || /\s/.test(val)) {
      return false;
    }
    const regex = new RegExp(`^https?:\\/\\/[^/\\s]+\\/(?:.+\\/)?[^/\\s.][^/\\s]*\\.(${extPattern})$`, 'i');
    return regex.test(val);
  }

  function setCheckVisible(id, isValid) {

  // --- Beregn udgivelsestidspunkt ud fra produktionsdato + starttid + holdback-timer ---
  function computeHoldbackDateLocal(dateIso, timeStr, addHours = HOLDBACK_HOURS) {
    const dateMatch = String(dateIso || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!dateMatch) return getNowLocalInput();

    const y = Number(dateMatch[1]);
    const m = Number(dateMatch[2]);
    const d = Number(dateMatch[3]);

    const timeMatch = String(timeStr || '').trim().match(/^(\d{1,2}):(\d{2})$/);
    const hh = timeMatch ? Number(timeMatch[1]) : 0;
    const mm = timeMatch ? Number(timeMatch[2]) : 0;

    // UTC-beregning sikrer præcist datoskift over midnat/månedsskift uden sommer-/vintertidsforskydning
    const shifted = new Date(Date.UTC(y, m - 1, d, hh + addHours, mm, 0));
    const sy = shifted.getUTCFullYear();
    const sm = String(shifted.getUTCMonth() + 1).padStart(2, '0');
    const sd = String(shifted.getUTCDate()).padStart(2, '0');
    const shh = String(shifted.getUTCHours()).padStart(2, '0');
    const smm = String(shifted.getUTCMinutes()).padStart(2, '0');
    return `${sy}-${sm}-${sd}T${shh}:${smm}`;
  }

  // --- Intelligent udtræk af relevante tags ---
  function cleanCandidateTag(raw) {
    return String(raw || '')
      .replace(/\([^)]*\)/g, ' ')
      .replace(/^[\s:.,;\-–—/|"'«»]+|[\s:.,;\-–—/|"'«»]+$/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .toLocaleLowerCase('da-DK');
  }

  function isMeaningfulTag(tag) {
    if (!tag || tag.length < 2) return false;
    if (GENERIC_TAG_STOPWORDS.has(tag)) return false;
    // Ignorer rene tal og årstal/sæsoner (f.eks. "2026" eller "2025/26")
    if (/^\d+([./-]\d+)*$/.test(tag)) return false;
    // Ignorer runde-/etape-/dag-angivelser (f.eks. "2. runde", "3. etape", "dag 1")
    if (/^(\d+\.?\s*(runde|kamp|dag|del|etape|afdeling|afsnit|sæt|halvleg|heat)|runde\s*\d+|dag\s*\d+|del\s*\d+|kamp\s*\d+|etape\s*\d+)$/i.test(tag)) {
      return false;
    }
    return true;
  }

  function parseTitleStructure(sportRaw, titleRaw) {
    let sport = cleanCandidateTag(sportRaw);
    let working = String(titleRaw || '').replace(/\([^)]*\)/g, ' ').trim();

    if (!sport && working.includes(':')) {
      const firstColon = working.indexOf(':');
      sport = cleanCandidateTag(working.slice(0, firstColon));
      working = working.slice(firstColon + 1).trim();
    } else if (sport && working.toLocaleLowerCase('da-DK').startsWith(sport + ':')) {
      working = working.slice(sport.length + 1).trim();
    }

    const colonParts = working.split(':').map(s => s.trim()).filter(Boolean);
    const contextTags = [];
    const participants = [];
    const matchupRegex = /\s+[-–—]\s+|\s+(?:mod|vs\.?)\s+/i;

    colonParts.forEach((segment, idx) => {
      if (matchupRegex.test(segment)) {
        const sides = segment.split(matchupRegex);
        sides.forEach(side => {
          side.split(',').forEach(piece => {
            const cleaned = cleanCandidateTag(piece);
            if (isMeaningfulTag(cleaned)) participants.push(cleaned);
          });
        });
      } else if (idx < colonParts.length - 1) {
        segment.split(',').forEach(piece => {
          const cleaned = cleanCandidateTag(piece);
          if (isMeaningfulTag(cleaned)) contextTags.push(cleaned);
        });
      } else {
        segment.split(',').forEach(piece => {
          const cleaned = cleanCandidateTag(piece);
          if (isMeaningfulTag(cleaned)) participants.push(cleaned);
        });
      }
    });

    return { sport, contextTags, participants };
  }

  function findHistoricalLeagueTags(sport, participants) {
    if (!participants.length || !items.length) return [];

    // Opbyg statistik over faste turneringstags pr. hold/deltager ud fra eksisterende rss.xml
    const participantStats = participants.map(participant => {
      let matchCount = 0;
      const tagCounts = new Map();

      items.forEach(pastItem => {
        const parsedPast = parseTitleStructure('', pastItem.title);
        if (sport && parsedPast.sport && parsedPast.sport !== sport) return;

        const pastEntities = [...parsedPast.contextTags, ...parsedPast.participants];
        if (!pastEntities.includes(participant)) return;

        matchCount++;
        const otherTitleEntities = pastEntities.filter(e => e !== participant);
        const pastTags = String(pastItem.tags || '')
          .split(',')
          .map(cleanCandidateTag)
          .filter(isMeaningfulTag);

        const uniqueInClip = new Set(pastTags);
        uniqueInClip.forEach(t => {
          if (t === sport || participants.includes(t)) return;
          // Udeluk tidligere modstandere (tags der optræder i det gamle klips egen titel)
          const overlapsPastTitleEntity = otherTitleEntities.some(
            ent => ent === t || ent.includes(t) || t.includes(ent)
          );
          if (overlapsPastTitleEntity) return;

          tagCounts.set(t, (tagCounts.get(t) || 0) + 1);
        });
      });

      return { participant, matchCount, tagCounts };
    });

    // Hvis mindst to hold er i kampen, og begge optræder med samme liga-tag tidligere i rss.xml
    const activeStats = participantStats.filter(s => s.matchCount > 0);
    if (activeStats.length >= 2) {
      const firstMap = activeStats[0].tagCounts;
      const sharedCandidates = [];
      firstMap.forEach((countA, candidate) => {
        const sharedByAll = activeStats.slice(1).every(s => s.tagCounts.has(candidate));
        if (sharedByAll) {
          const totalScore = activeStats.reduce((sum, s) => sum + (s.tagCounts.get(candidate) || 0), 0);
          sharedCandidates.push({ candidate, totalScore });
        }
      });
      if (sharedCandidates.length > 0) {
        sharedCandidates.sort((a, b) => b.totalScore - a.totalScore);
        return [sharedCandidates[0].candidate];
      }
    }

    // Ellers vælg et gennemgående liga-tag fra et enkelt hold (kræver mindst 2 klip og >= 60% dækning)
    const fallbackCandidates = [];
    activeStats.forEach(s => {
      if (s.matchCount < 2) return;
      s.tagCounts.forEach((cnt, candidate) => {
        if (cnt >= 2 && (cnt / s.matchCount) >= 0.6) {
          fallbackCandidates.push({ candidate, cnt });
        }
      });
    });

    if (fallbackCandidates.length > 0) {
      fallbackCandidates.sort((a, b) => b.cnt - a.cnt);
      return [fallbackCandidates[0].candidate];
    }

    return [];
  }

  function generateSmartTags(prodItem) {
    const { sport, contextTags, participants } = parseTitleStructure(
      prodItem.sport,
      prodItem.programTitle || prodItem.fullTitle
    );

    const ordered = [];
    const addUnique = (tag) => {
      if (tag && !ordered.includes(tag)) ordered.push(tag);
    };

    if (sport && isMeaningfulTag(sport)) {
      addUnique(sport);
    }

    if (contextTags.length > 0) {
      contextTags.forEach(addUnique);
    } else {
      const historical = findHistoricalLeagueTags(sport, participants);
      historical.forEach(addUnique);
    }

    participants.forEach(addUnique);

    return ordered.join(', ');
  }

  // --- Hent seneste produktioner fra Google Sheet via Apps Script ---
  async function loadProductionsDropdown() {
    const selectEl = document.getElementById('productionSelect');
    const url = (PRODUCTION_WEBAPP_URL || '').trim();

    if (!url || url.includes('INDSÆT_')) {
      selectEl.innerHTML = '<option value="">Indsæt Webapp-URL i index.html for at hente produktioner</option>';
      selectEl.disabled = true;
      return;
    }

    selectEl.disabled = true;
    selectEl.innerHTML = '<option value="">Henter seneste produktioner ...</option>';

    try {
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(`${url}${sep}t=${Date.now()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      if (!data.ok || !Array.isArray(data.items)) {
        throw new Error(data.error || 'Ugyldigt svar fra produktionsdatabasen.');
      }

      productionItems = data.items;

      if (productionItems.length === 0) {
        selectEl.innerHTML = '<option value="">Ingen produktioner fundet de seneste 7 dage</option>';
        return;
      }

      const optionsHtml = [
        '<option value="">Vælg udsendelse fra de seneste 7 dage</option>',
        ...productionItems.map((it, idx) => {
          const label = `${it.dateDisplay} – ${it.fullTitle}`;
          return `<option value="${idx}">${escapeHtml(label)}</option>`;
        })
      ].join('');

      selectEl.innerHTML = optionsHtml;
      selectEl.disabled = false;
    } catch (err) {
      selectEl.innerHTML = '<option value="">Kunne ikke hente produktionslisten (skriv titel nedenfor)</option>';
      selectEl.disabled = true;
    }
  }

  function normalizePrefilledUrl(val, defaultPrefix) {
    const trimmed = (val || '').trim();
    if (trimmed.startsWith(defaultPrefix)) {
      const rest = trimmed.slice(defaultPrefix.length).trim();
      if (/^https?:\/\//i.test(rest)) {
        return rest;
      }
      if (rest.startsWith('/')) {
        return defaultPrefix + rest.replace(/^\/+/, '');
      }
    }
    return trimmed;
  }

  function setupPrefilledUrlField(inputEl, defaultPrefix) {
    let isMouseDown = false;
    inputEl.addEventListener('mousedown', () => { isMouseDown = true; });
    inputEl.addEventListener('mouseup', () => { isMouseDown = false; });

    // Ved Tab ind i feltet placeres markøren efter skråstregen i stedet for at markere og overskrive stien
    inputEl.addEventListener('focus', () => {
      if (!isMouseDown && inputEl.value === defaultPrefix) {
        setTimeout(() => {
          try {
            const len = inputEl.value.length;
            inputEl.setSelectionRange(len, len);
          } catch (e) {}
        }, 0);
      }
    });

    // Ryd automatisk op, hvis nogen indsætter en fuld URL eller en ekstra "/" efter standard-stien
    inputEl.addEventListener('input', () => {
      const cleaned = normalizePrefilledUrl(inputEl.value, defaultPrefix);
      if (cleaned !== inputEl.value) {
        inputEl.value = cleaned;
      }
      updateFormCheckmarks();
    });

    inputEl.addEventListener('change', updateFormCheckmarks);
  }

  function showStatus(msg, type = 'info') {

      clearTimeout(statusTimer);

    el.textContent = msg;

  function showLoginError(msg) {
    const errEl = document.getElementById('loginError');

      errEl.style.display = 'none';
      errEl.textContent = '';
    } else {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }
  }

  // --- Validering af GitHub-nøgle ved login ---
  async function verifyGitHubToken(token) {
    const clean = (token || '').trim();
    if (!clean) return { ok: false, reason: 'Indtast venligst en nøgle.' };

    const headers = {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${clean}`
    };

    try {
      const userRes = await fetch(`https://api.github.com/user?t=${Date.now()}`, {
        cache: 'no-store',
        headers
      });

      if (userRes.status === 401) {
        return { ok: false, reason: 'GitHub-nøglen er enten ugyldig eller udløbet.' };
      }
      if (!userRes.ok) {
        return { ok: false, reason: `Forbindelsen blev afvist (HTTP ${userRes.status}).` };
      }

      const repoRes = await fetch(
        `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}?t=${Date.now()}`,
        { cache: 'no-store', headers }
      );

      if (repoRes.status === 404) {
        return {
          ok: false,
          reason: `Repositoriet ${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo} blev ikke fundet.`
        };
      }
      if (!repoRes.ok) {
        return { ok: false, reason: `Kunne ikke tilgå repositoriet (HTTP ${repoRes.status}).` };
      }

      const repoData = await repoRes.json();
      if (repoData.permissions && repoData.permissions.push === false) {
        return { ok: false, reason: 'Kontoen bag nøglen har ikke skriveadgang til repositoriet.' };
      }

      return { ok: true };
    } catch (err) {
      return { ok: false, reason: 'Netværksfejl ved login. Tjek internetforbindelsen.' };
    }
  }

  async function unlockAppWithToken(token, isAutoLogin = false) {
    const loginCard = document.getElementById('loginCard');
    const btn = document.getElementById('btnLoginSubmit');
    const form = document.getElementById('loginForm');
    const subtitle = document.getElementById('loginSubtitle');
    const loadingText = document.getElementById('loginLoadingText');

    showLoginError('');
    btn.disabled = true;
    btn.textContent = 'Kontrollerer nøgle ...';
    if (isAutoLogin) {
      loginCard.classList.add('auto-loading');
      form.style.display = 'none';
      subtitle.style.display = 'none';
      loadingText.style.display = 'block';
    }

    const check = await verifyGitHubToken(token);

    if (!check.ok) {
      loginCard.classList.remove('auto-loading');
      btn.disabled = false;
      btn.textContent = 'Log ind';
      form.style.display = 'block';
      subtitle.style.display = 'block';
      loadingText.style.display = 'none';
      localStorage.removeItem(TOKEN_STORAGE_KEY);
      activeToken = '';
      document.getElementById('appContent').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      showLoginError(check.reason);
      return;
    }

    activeToken = token.trim();
    localStorage.setItem(TOKEN_STORAGE_KEY, activeToken);
    document.getElementById('loginScreen').style.display = 'none';
    loginCard.classList.remove('auto-loading');
    btn.disabled = false;
    btn.textContent = 'Log ind';
    form.style.display = 'block';
    subtitle.style.display = 'block';
    loadingText.style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    resetAddClipDefaults();
    loadProductionsDropdown();
    await loadFeedFromGitHub();
  }

  function lockApp(reasonMsg = '') {
    localStorage.removeItem(TOKEN_STORAGE_KEY);
    activeToken = '';
    document.getElementById('loginCard').classList.remove('auto-loading');
    document.getElementById('loginSubtitle').style.display = 'block';
    document.getElementById('loginLoadingText').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('loginTokenInput').value = '';
    document.getElementById('appContent').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    showLoginError(reasonMsg);
  }

  // --- Dato- og tidsformatering ---
  function getNowLocalInput() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${d}T${hh}:${mm}`;
  }

  function localInputToPubDate(dtLocal) {
    const [datePart, timePart] = dtLocal.split('T');
    const [y, m, d] = datePart.split('-').map(Number);
    const [hh, mm] = (timePart || '00:00').split(':').map(Number);
    const utcObj = new Date(Date.UTC(y, m - 1, d, hh, mm, 0));
    const dayName = DAYS[utcObj.getUTCDay()];
    const dd = String(d).padStart(2, '0');
    const monName = MONTHS[m - 1];
    const HH = String(hh).padStart(2, '0');
    const MM = String(mm).padStart(2, '0');
    return `${dayName}, ${dd} ${monName} ${y} ${HH}:${MM}:00 +0000`;
  }

  function parsePubDate(pubDateStr) {
    const d = new Date((pubDateStr || '').trim());
    if (isNaN(d.getTime())) {
      const fallback = getNowLocalInput();
      return { timestamp: 0, dtLocal: fallback, display: pubDateStr || 'Ukendt dato' };
    }
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
    const day = String(d.getUTCDate()).padStart(2, '0');
    const hh = String(d.getUTCHours()).padStart(2, '0');
    const mm = String(d.getUTCMinutes()).padStart(2, '0');
    return {
      timestamp: d.getTime(),
      dtLocal: `${y}-${m}-${day}T${hh}:${mm}`,
      display: `${day}-${m}-${y} ${hh}:${mm}`
    };
  }

  // --- Thumbnail-hjælpere (håndterer http -> https preview og fallback) ---
  function buildThumbSources(rawUrl) {
    const clean = (rawUrl || '').trim();
    if (!clean) return { primary: '', fallback: '' };

    let normalized = clean;
    try {
      normalized = new URL(clean).href;
    } catch (e) {
      normalized = encodeURI(clean);
    }

    if (/^http:\/\//i.test(normalized)) {
      const proxyUrl = `https://wsrv.nl/?url=${encodeURIComponent(normalized)}&w=256&h=144&fit=cover`;
      return { primary: proxyUrl, fallback: normalized };
    }

    return { primary: normalized, fallback: '' };
  }

  window.handleThumbError = function(imgEl) {
    const fallback = imgEl.getAttribute('data-fallback');
    if (fallback && !imgEl.getAttribute('data-retried')) {
      imgEl.setAttribute('data-retried', '1');
      imgEl.src = fallback;
      return;
    }
    const box = imgEl.closest('.clip-thumb-box');
    if (box) box.classList.add('thumb-unavailable');
    imgEl.remove();
  };

  function renderThumbnailBox(thumbUrl) {
    const clean = (thumbUrl || '').trim();
    const sources = buildThumbSources(clean);
    const fallbackIcon = `
      <span class="clip-thumb-fallback" title="Billedet er ikke tilgængeligt i øjeblikket">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </span>
    `;

    if (!sources.primary) {
      return `<div class="clip-thumb-box thumb-unavailable">${fallbackIcon}</div>`;
    }

    return `
      <a href="${escapeHtml(clean)}" target="_blank" rel="noopener" class="clip-thumb-link" title="Åbn billede i ny fane">
        <div class="clip-thumb-box">
          <img src="${escapeHtml(sources.primary)}" data-fallback="${escapeHtml(sources.fallback)}" alt="" loading="lazy" onerror="handleThumbError(this)">
          ${fallbackIcon}
        </div>
      </a>
    `;
  }

  // --- UTF-8 Base64 & XML-hjælpere ---
  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function base64ToUtf8(b64) {
    const binary = atob(b64.replace(/\s/g, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function escapeXml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function sortItemsDesc() {
    items.sort((a, b) => parsePubDate(b.pubDate).timestamp - parsePubDate(a.pubDate).timestamp);
  }

  function buildXmlString() {
    const feedUrl = getPublicFeedUrl();
    const lastBuild = localInputToPubDate(getNowLocalInput());
    const itemBlocks = items.map(it => [
      '    <item>',
      `      <title>${escapeXml(it.title)}</title>`,
      `      <link>${escapeXml(it.link)}</link>`,
      `      <pubDate>${escapeXml(it.pubDate)}</pubDate>`,
      `      <enclosure url="${escapeXml(it.thumb)}" type="image/jpeg" length="0" />`,
      `      <guid>${escapeXml(it.link)}</guid>`,
      `      <category>${escapeXml(it.tags)}</category>`,
      '    </item>'
    ].join('\n')).join('\n');

    return [
      '<?xml version="1.0" encoding="UTF-8"?>',
      '<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">',
      '  <channel>',
      '    <title>SportLive RSS Feed</title>',
      '    <link>https://www.sport-live.dk/</link>',
      `    <atom:link href="${escapeXml(feedUrl)}" rel="self" type="application/rss+xml" xmlns:atom="http://www.w3.org/2005/Atom"/>`,
      '    <description>Latest submissions from SportLive</description>',
      `    <lastBuildDate>${escapeXml(lastBuild)}</lastBuildDate>`,
      itemBlocks,
      '  </channel>',
      '</rss>',
      ''
    ].join('\n');
  }

  function parseXmlToItems(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    if (doc.querySelector('parsererror')) {
      throw new Error('RSS-filen indeholder ugyldig XML.');
    }
    const nodes = Array.from(doc.querySelectorAll('channel > item'));
    return nodes.map((node, idx) => {
      const getTxt = tag => node.querySelector(tag)?.textContent ?? '';
      const enc = node.querySelector('enclosure');
      return {
        id: 'item_' + Date.now() + '_' + idx,
        title: getTxt('title').trim(),
        link: getTxt('link').trim(),
        pubDate: getTxt('pubDate').trim(),
        thumb: (enc?.getAttribute('url') || '').trim(),
        tags: getTxt('category').trim()
      };
    });
  }

  // --- URL-tjek mod tastefejl og manglende filnavn ---
  function validateUrlsBeforeSave(videoUrl, thumbUrl) {
    if (videoUrl === DEFAULT_VIDEO_PREFIX || /\/$/.test(videoUrl)) {
      alert('Husk at tilføje selve filnavnet i "URL til video".');
      return false;
    }
    if (thumbUrl === DEFAULT_THUMB_PREFIX || /\/$/.test(thumbUrl)) {
      alert('Husk at tilføje selve filnavnet i "URL til billede".');
      return false;
    }

    const warnings = [];
    if (/\s/.test(videoUrl)) warnings.push('Video-URL indeholder mellemrum.');
    if (!/\.(mp4|mov)$/i.test(videoUrl)) warnings.push('Video-URL slutter ikke på .mp4 eller .mov.');
    if (/\s/.test(thumbUrl)) warnings.push('Billede-URL indeholder mellemrum.');
    if (!/\.(png|jpg|jpeg)$/i.test(thumbUrl)) warnings.push('Billede-URL slutter ikke på .png eller .jpg.');

    if (warnings.length > 0) {
      return confirm('Bemærk:\n- ' + warnings.join('\n- ') + '\n\nVil du gemme videoen alligevel?');
    }
    return true;
  }

  // --- Hent og gem RSS-fil ---
  async function loadFeedFromGitHub() {
    const { owner, repo, branch, path } = GITHUB_CONFIG;
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}&t=${Date.now()}`;
    const headers = {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${activeToken}`
    };

    try {
      const res = await fetch(apiUrl, { cache: 'no-store', headers });
      if (res.status === 401) {
        lockApp('Din adgangsnøgle er udløbet eller ugyldig. Indtast en ny nøgle.');
        return;
      }
      if (res.status === 404) {
        items = [];
        currentSha = null;
        renderList();
        showStatus(`Ingen ${path} fundet endnu. Filen oprettes automatisk, når du gemmer din første video.`, 'info');
        return;
      }
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      currentSha = data.sha;
      const xmlText = base64ToUtf8(data.content);
      items = parseXmlToItems(xmlText);
      sortItemsDesc();
      renderList();
    } catch (err) {
      document.getElementById('clipsContainer').textContent = 'Kunne ikke hente RSS-filen.';
      showStatus(`Kunne ikke hente RSS-filen (${err.message}).`, 'error');
    }
  }

  async function saveFeedToGitHub(commitMessage) {
    const { owner, repo, branch, path } = GITHUB_CONFIG;
    sortItemsDesc();
    const xmlString = buildXmlString();
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const headers = {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${activeToken}`,
      'Content-Type': 'application/json'
    };

    try {
      showStatus('Gemmer i RSS-filen ...', 'info');

      const checkRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}&t=${Date.now()}`, { cache: 'no-store', headers });
      if (checkRes.status === 401) {
        lockApp('Din adgangsnøgle er udløbet. Log ind med en ny nøgle for at gemme.');
        return false;
      }
      if (checkRes.ok) {
        const checkData = await checkRes.json();
        currentSha = checkData.sha;
      } else if (checkRes.status === 404) {
        currentSha = null;
      }

      const body = {
        message: commitMessage,
        content: utf8ToBase64(xmlString),
        branch
      };
      if (currentSha) body.sha = currentSha;

      const putRes = await fetch(apiUrl, {
        method: 'PUT',
        headers,
        body: JSON.stringify(body)
      });

      if (putRes.status === 401) {
        lockApp('Din adgangsnøgle er udløbet. Log ind med en ny nøgle.');
        return false;
      }
      if (putRes.status === 403) {
        lockApp('Den indtastede nøgle mangler skriverettighed ("Contents: Read and write") til RSS-repositoriet. Indtast en nøgle med skriveadgang.');
        return false;
      }
      if (!putRes.ok) {
        const errData = await putRes.json().catch(() => ({}));
        throw new Error(errData.message || `HTTP ${putRes.status}`);
      }

      const result = await putRes.json();
      currentSha = result.content.sha;
      renderList();
      showStatus('RSS-filen er opdateret.', 'success');
      return true;
    } catch (err) {
      showStatus(`Fejl under gemning: ${err.message}`, 'error');
      return false;
    }
  }

  // --- Visning af oversigt ---
  function renderList() {
    const container = document.getElementById('clipsContainer');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    document.getElementById('listHeading').textContent = `Indhold i RSS-filen (${items.length})`;

    const filtered = items.filter(it => {
      if (!query) return true;
      return (
        it.title.toLowerCase().includes(query) ||
        it.link.toLowerCase().includes(query) ||
        it.tags.toLowerCase().includes(query) ||
        it.pubDate.toLowerCase().includes(query)
      );
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="color:var(--muted); margin:0;">Intet indhold at vise.</p>';
      document.getElementById('showMoreWrap').style.display = 'none';
      return;
    }

    const visible = (showAllItems || query) ? filtered : filtered.slice(0, DEFAULT_LIMIT);
    const moreWrap = document.getElementById('showMoreWrap');
    if (!showAllItems && !query && filtered.length > DEFAULT_LIMIT) {
      moreWrap.style.display = 'block';
      document.getElementById('btnShowAll').textContent = `Vis alle (${filtered.length})`;
    } else {
      moreWrap.style.display = 'none';
    }

    container.innerHTML = visible.map(it => {
      const parsedDate = parsePubDate(it.pubDate);
      const linkHtml = it.link
        ? `<a href="${escapeHtml(it.link)}" target="_blank" rel="noopener" title="${escapeHtml(it.link)}">${escapeHtml(it.link)}</a>`
        : '—';
      const thumbHtml = it.thumb
        ? `<a href="${escapeHtml(it.thumb)}" target="_blank" rel="noopener" title="${escapeHtml(it.thumb)}">${escapeHtml(it.thumb)}</a>`
        : '—';

      return `
        <div class="clip-item" id="card_${it.id}" data-id="${it.id}">
          <div class="clip-top">
            <h3 class="clip-title">${escapeHtml(it.title)}</h3>
            <div class="clip-actions">
              <button type="button" class="btn btn-blue btn-sm" onclick="toggleEdit('${it.id}')">Rediger</button>
              <button type="button" class="btn btn-danger btn-sm" id="delbtn_${it.id}" onclick="deleteClip('${it.id}')">Slet</button>
            </div>
          </div>

          <div class="clip-body">
            <dl class="clip-meta">
              <dt>Dato:</dt>
              <dd>${escapeHtml(parsedDate.display)}</dd>
              <dt>Link:</dt>
              <dd class="${it.link ? 'link-cell' : ''}">${linkHtml}</dd>
              <dt>Thumbnail:</dt>
              <dd class="${it.thumb ? 'link-cell' : ''}">${thumbHtml}</dd>
              <dt>Tags:</dt>
              <dd title="${escapeHtml(it.tags || '')}">${escapeHtml(it.tags || '—')}</dd>
            </dl>
            ${renderThumbnailBox(it.thumb)}
          </div>

          <div class="clip-edit-panel" id="edit_${it.id}">
            <div class="form-group">
              <label>Titel</label>
              <input type="text" id="etitle_${it.id}" value="${escapeHtml(it.title)}">
            </div>
            <div class="form-group">
              <label>URL til video</label>
              <input type="url" id="elink_${it.id}" value="${escapeHtml(it.link)}">
            </div>
            <div class="form-group">
              <label>URL til billede</label>
              <input type="url" id="ethumb_${it.id}" value="${escapeHtml(it.thumb)}">
            </div>
            <div class="form-group">
              <label>Udgivelsestidspunkt</label>
              <input type="datetime-local" id="edate_${it.id}" value="${escapeHtml(parsedDate.dtLocal)}">
            </div>
            <div class="form-group">
              <label>Tags (adskilles med komma)</label>
              <input type="text" id="etags_${it.id}" value="${escapeHtml(it.tags)}">
            </div>
            <div class="edit-buttons">
              <button type="button" class="btn btn-sm" id="cancelbtn_${it.id}" onclick="toggleEdit('${it.id}')">Annuller</button>
              <button type="button" class="btn btn-green btn-sm" id="savebtn_${it.id}" onclick="saveEditedClip('${it.id}')">Gem</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // --- Handlinger på eksisterende indhold ---
  window.toggleEdit = function(id) {
    const card = document.getElementById('card_' + id);
    const panel = document.getElementById('edit_' + id);
    if (!card || !panel) return;

    const isOpening = !panel.classList.contains('open');

    if (isOpening) {
      const item = items.find(x => x.id === id);
      if (item) {
        const parsedDate = parsePubDate(item.pubDate);
        document.getElementById('etitle_' + id).value = item.title;
        document.getElementById('elink_' + id).value = item.link;
        document.getElementById('ethumb_' + id).value = item.thumb;
        document.getElementById('edate_' + id).value = parsedDate.dtLocal;
        document.getElementById('etags_' + id).value = item.tags;
      }

      card.classList.add('editing');
      panel.classList.add('open');

      // Automatisk scroll, hvis det udfoldede indhold går ud over skærmens nederste kant
      requestAnimationFrame(() => {
        const rect = card.getBoundingClientRect();
        const bottomMargin = 24;
        const viewportHeight = window.innerHeight;

        if (rect.bottom + bottomMargin > viewportHeight) {
          const overflowBottom = (rect.bottom + bottomMargin) - viewportHeight;
          if (rect.height + 36 <= viewportHeight) {
            window.scrollBy({ top: overflowBottom, behavior: 'smooth' });
          } else {
            const panelRect = panel.getBoundingClientRect();
            const panelOverflow = (panelRect.bottom + bottomMargin) - viewportHeight;
            if (panelOverflow > 0) {
              window.scrollBy({ top: panelOverflow, behavior: 'smooth' });
            }
          }
        }
      });
    } else {
      card.classList.remove('editing');
      panel.classList.remove('open');
    }
  };

  window.saveEditedClip = async function(id) {
    const idx = items.findIndex(x => x.id === id);
    if (idx === -1) return;

    const title = document.getElementById('etitle_' + id).value.trim();
    const link = document.getElementById('elink_' + id).value.trim();
    const thumb = document.getElementById('ethumb_' + id).value.trim();
    const dtLocal = document.getElementById('edate_' + id).value;
    const tags = document.getElementById('etags_' + id).value.trim();

    if (!title || !link || !thumb || !dtLocal) {
      alert('Udfyld venligst både titel, video-URL, billede-URL og udgivelsestidspunkt.');
      return;
    }
    if (!validateUrlsBeforeSave(link, thumb)) return;

    const saveBtn = document.getElementById('savebtn_' + id);
    const cancelBtn = document.getElementById('cancelbtn_' + id);
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Gemmer ...';
    }
    if (cancelBtn) cancelBtn.disabled = true;

    const backup = { ...items[idx] };
    items[idx] = {
      ...items[idx],
      title,
      link,
      pubDate: localInputToPubDate(dtLocal),
      thumb,
      tags
    };

    const ok = await saveFeedToGitHub(`Opdateret: ${title}`);
    if (!ok) {
      items[idx] = backup;
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Gem';
      }
      if (cancelBtn) cancelBtn.disabled = false;
    }
  };

  window.deleteClip = async function(id) {
    const target = items.find(x => x.id === id);
    if (!target) return;
    if (!confirm(`Er du sikker på, at du vil slette:\n"${target.title}"?`)) return;

    const delBtn = document.getElementById('delbtn_' + id);
    if (delBtn) {
      delBtn.disabled = true;
      delBtn.textContent = 'Sletter ...';
    }

    const prevItems = [...items];
    items = items.filter(x => x.id !== id);
    const ok = await saveFeedToGitHub(`Slettet: ${target.title}`);
    if (!ok) {
      items = prevItems;
      if (delBtn) {
        delBtn.disabled = false;
        delBtn.textContent = 'Slet';
      }
    }
  };

  // --- Opstart og Event Listeners ---
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('linkOpenFeed').href = getPublicFeedUrl();
    document.getElementById('modalFileLabel').textContent = GITHUB_CONFIG.path;

    setupPrefilledUrlField(document.getElementById('newVideoUrl'), DEFAULT_VIDEO_PREFIX);
    setupPrefilledUrlField(document.getElementById('newThumbUrl'), DEFAULT_THUMB_PREFIX);

    const productionSelect = document.getElementById('productionSelect');
    const newTitleInput = document.getElementById('newTitle');
    const newPubDateInput = document.getElementById('newPubDate');
    const newTagsInput = document.getElementById('newTags');

    productionSelect.addEventListener('change', () => {
      const selectedVal = productionSelect.value;

      if (selectedVal === '') {
        newTitleInput.value = '';
        newTagsInput.value = '';
        newPubDateInput.value = getNowLocalInput();
        pubDateConfirmed = false;
        updateFormCheckmarks();
        return;
      }

      const prodItem = productionItems[Number(selectedVal)];
      if (!prodItem) return;

      newTitleInput.value = prodItem.fullTitle;
      newPubDateInput.value = computeHoldbackDateLocal(prodItem.dateIso, prodItem.time, HOLDBACK_HOURS);
      newTagsInput.value = generateSmartTags(prodItem);
      pubDateConfirmed = true;
      updateFormCheckmarks();
    });

    newTitleInput.addEventListener('input', () => {
      if (newTitleInput.value.trim() === '' && productionSelect.value !== '') {
        productionSelect.value = '';
      }
      updateFormCheckmarks();
    });
    newTitleInput.addEventListener('change', updateFormCheckmarks);

    ['input', 'change', 'blur'].forEach(evt => {
      newPubDateInput.addEventListener(evt, () => {
        if (newPubDateInput.value) pubDateConfirmed = true;
        updateFormCheckmarks();
      });
    });

    newTagsInput.addEventListener('input', updateFormCheckmarks);
    newTagsInput.addEventListener('change', updateFormCheckmarks);

    document.getElementById('statusBanner').addEventListener('click', (e) => {
      e.currentTarget.style.display = 'none';
    });

    const savedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
    if (savedToken) {
      unlockAppWithToken(savedToken, true);
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const inputToken = document.getElementById('loginTokenInput').value;
      unlockAppWithToken(inputToken, false);
    });

    document.getElementById('addClipForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('newTitle').value.trim();
      const link = normalizePrefilledUrl(document.getElementById('newVideoUrl').value, DEFAULT_VIDEO_PREFIX);
      const thumb = normalizePrefilledUrl(document.getElementById('newThumbUrl').value, DEFAULT_THUMB_PREFIX);
      const dtLocal = document.getElementById('newPubDate').value;
      const tags = document.getElementById('newTags').value.trim();

      if (!validateUrlsBeforeSave(link, thumb)) return;

      const btn = document.getElementById('btnSubmitNew');
      btn.disabled = true;
      btn.textContent = 'Gemmer ...';

      const newItem = {
        id: 'item_' + Date.now(),
        title,
        link,
        pubDate: localInputToPubDate(dtLocal),
        thumb,
        tags
      };

      items.unshift(newItem);
      const ok = await saveFeedToGitHub(`Tilføjet: ${title}`);
      btn.disabled = false;
      btn.textContent = 'Gem';

      if (ok) {
        document.getElementById('addClipForm').reset();
        resetAddClipDefaults();
      } else {
        items = items.filter(x => x.id !== newItem.id);
      }
    });

    document.getElementById('searchInput').addEventListener('input', renderList);

    document.getElementById('btnShowAll').addEventListener('click', () => {
      showAllItems = true;
      renderList();
    });

    document.getElementById('btnShowPopup').addEventListener('click', () => {
      document.getElementById('xmlModalContent').textContent = buildXmlString();
      document.getElementById('xmlModal').classList.add('open');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => {
      document.getElementById('xmlModal').classList.remove('open');
    });

    document.getElementById('xmlModal').addEventListener('click', (e) => {
      if (e.target.id === 'xmlModal') document.getElementById('xmlModal').classList.remove('open');
    });

    document.getElementById('btnCopyXml').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      await navigator.clipboard.writeText(buildXmlString());
      const orig = btn.textContent;
      btn.textContent = 'Kopieret!';
      setTimeout(() => btn.textContent = orig, 1800);
    });

    document.getElementById('btnCopyUrl').addEventListener('click', async () => {
      const labelEl = document.getElementById('copyUrlText');
      await navigator.clipboard.writeText(getPublicFeedUrl());
      const orig = labelEl.textContent;
      labelEl.textContent = 'URL kopieret!';
      setTimeout(() => labelEl.textContent = orig, 1800);
    });
  });
</script>
